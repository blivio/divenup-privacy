<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite para o DivenUp</title>
  <meta name="robots" content="noindex">

  <!-- Preview no WhatsApp / redes. Trocar a URL da imagem quando sair
       do GitHub Pages para o dominio proprio. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Convite para o DivenUp">
  <meta property="og:description" content="Organize seus eventos e divida as contas com os participantes.">
  <meta property="og:image" content="https://blivio.github.io/divenup-privacy/convite/icon.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta name="twitter:card" content="summary">

  <style>
    :root {
      --brand: #0F766E;
      --brand-dark: #0B5F59;
      --bg: #F3F8F7;
      --surface: #FFFFFF;
      --border: #DCE9E6;
      --text: #0F2E2A;
      --muted: #5C7370;
      --faint: #94A8A4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px 24px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(15, 46, 42, .08);
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.3;
      margin: 0 0 8px;
    }

    .event {
      font-size: 15px;
      color: var(--brand);
      font-weight: 600;
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }

    .button:active { background: var(--brand-dark); }

    .button.ghost {
      background: transparent;
      color: var(--brand);
      border: 1px solid var(--border);
    }

    .open {
      display: inline-block;
      margin: 6px 0 18px;
      font-size: 14px;
      color: var(--brand);
      text-decoration: underline;
    }

    .hint {
      font-size: 13px;
      color: var(--faint);
      margin: 0;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 22px 0 18px;
    }

    .other {
      text-align: left;
    }

    .other h2 {
      font-size: 16px;
      margin: 0 0 6px;
    }

    .other p {
      font-size: 13px;
      margin: 0 0 8px;
    }

    footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    footer a { color: var(--faint); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" id="logo" src="./icon.png" alt="DivenUp"
         onerror="this.hidden = true">

    <h1 id="title">Convite para o DivenUp</h1>
    <p class="event" id="event" hidden></p>
    <p id="subtitle">Organize seus eventos e divida as contas com os participantes.</p>

    <a class="button" id="android" href="https://play.google.com/store/apps/details?id=com.divenup.contas">
      Baixar para Android
    </a>

    <a class="button ghost" id="ios" href="https://testflight.apple.com/join/wzW8nWqB">
      Baixar para iPhone
    </a>

    <a class="open" id="open" href="divenup://">Já tenho o app — abrir</a>

    <p class="hint" id="hint">Depois de criar sua conta, envie seu @usuário para quem te convidou.</p>

    <div class="other" id="other" hidden>
      <div class="divider"></div>
      <h2 id="other-title"></h2>
      <p id="other-subtitle"></p>
      <p class="hint" id="other-hint"></p>
    </div>

    <footer>
      <a href="https://blivio.github.io/divenup-privacy/">Privacidade</a>
    </footer>
  </main>

  <script>
    // Parametros: ?de=<@usuario>&e=<nome do evento>
    // Nunca usar innerHTML com eles: so textContent (evita XSS).
    (function () {
      var params = new URLSearchParams(window.location.search);

      var HANDLE_RE = /^[a-z0-9_.]{3,20}$/;

      var handle = String(params.get('de') || '')
        .trim()
        .replace(/^@+/, '')
        .toLowerCase();

      if (!HANDLE_RE.test(handle)) {
        handle = '';
      }

      var eventName = String(params.get('e') || '')
        .replace(/[\u0000-\u001F\u007F]/g, ' ')
        .trim()
        .slice(0, 80);

      function build(lang) {
        var who = handle ? '@' + handle : '';

        if (lang === 'en') {
          return {
            title: handle
              ? who + ' invited you to DivenUp'
              : 'You were invited to DivenUp',
            subtitle: 'Organize your events and split the bills with the participants.',
            event: 'Event: ' + eventName,
            android: 'Download for Android',
            ios: 'Download for iPhone',
            open: 'I already have the app — open',
            hint: handle
              ? 'After creating your account, send your @username to ' + who + '.'
              : 'After creating your account, send your @username to the person who invited you.'
          };
        }

        return {
          title: handle
            ? who + ' te convidou para o DivenUp'
            : 'Você foi convidado para o DivenUp',
          subtitle: 'Organize seus eventos e divida as contas com os participantes.',
          event: 'Evento: ' + eventName,
          android: 'Baixar para Android',
          ios: 'Baixar para iPhone',
          open: 'Já tenho o app — abrir',
          hint: handle
            ? 'Depois de criar sua conta, envie seu @usuário para ' + who + '.'
            : 'Depois de criar sua conta, envie seu @usuário para quem te convidou.'
        };
      }

      var lang =
        (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0
          ? 'pt'
          : 'en';

      var text = build(lang);

      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      document.title = text.title;

      document.getElementById('title').textContent = text.title;
      document.getElementById('subtitle').textContent = text.subtitle;

      if (eventName) {
        var eventEl = document.getElementById('event');
        eventEl.textContent = text.event;
        eventEl.hidden = false;
      }

      document.getElementById('android').textContent = text.android;
      document.getElementById('ios').textContent = text.ios;
      document.getElementById('open').textContent = text.open;
      document.getElementById('hint').textContent = text.hint;

      // Como na pagina de confirmacao: em PT mostra tambem a versao em
      // ingles; em EN o texto principal ja e ingles.
      if (lang === 'pt') {
        var other = build('en');
        var otherEl = document.getElementById('other');

        document.getElementById('other-title').textContent = other.title;
        document.getElementById('other-subtitle').textContent = other.subtitle;
        document.getElementById('other-hint').textContent = other.hint;

        otherEl.hidden = false;
      }

      // No celular mostra so a loja da plataforma; no desktop, as duas.
      var ua = navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);

      if (isIOS) {
        document.getElementById('android').hidden = true;
      } else if (isAndroid) {
        document.getElementById('ios').hidden = true;
      } else {
        document.getElementById('open').hidden = true;
      }
    })();
  </script>
</body>
</html>
